# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# fork（gmn）用のリリース設定。本家の .goreleaser.yaml とは別ファイルで、本家の設定は変えない。
# タグは gmn-v0.1.0 形式。GoReleaser OSS は monorepo.tag_prefix（Pro 限定）を使えない。
# 版は .Tag から "gmn-v" を trimprefix で外して得る（ldflags の gmn.Version）。
# 現在のタグを semver として解析する検査は --skip=validate でだけ外せる（release workflow と snapshot が付ける）。
# そのため ctx.Semver は空になり、prerelease: auto・skip_upload: auto は常に正式版扱いになる。
# prerelease は release workflow が gh release edit で付け、cask は skip_upload のテンプレートで判定する。
version: 2

project_name: gmn-cli

# 本家の .goreleaser.yaml は before に go mod tidy を置くが、snapshot で go.mod を書き換えないよう置かない。

builds:
  - id: gmn
    main: ./cmd/gmn
    binary: gmn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # gmn: fork の版は internal/gmn の Version に入れる（本家の main.version は使わない）
      - -X github.com/google-gemini/gemini-api-cli/internal/gmn.Version={{ trimprefix .Tag "gmn-v" }}

archives:
  - id: gmn
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

# Homebrew: GoReleaser v2.10 で brews（Formula）は deprecated、後継の homebrew_casks を使う。
# CLI のバイナリは binaries で入れられる。cask は macOS 専用（Linux の Homebrew には出さない）。
homebrew_casks:
  - name: gmn-cli
    ids:
      - gmn
    binaries:
      - gmn
    # バイナリは Apple の公証を受けていない（ad-hoc 署名だけ）。brew が付ける com.apple.quarantine が残ると
    # Gatekeeper が「開いていません」と出して起動を拒否するので、入れた後に外す。
    # 公証すれば要らなくなるが、Apple Developer Program が要るので今は選ばない（#19）。
    # --no-quarantine などで属性が無いと xattr -d は失敗するので、失敗しても install は止めない。
    # install_steps は Homebrew の postflight_steps になり、chdir の "." は staged path を指す。
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "gmn"], chdir: ".", must_succeed: false
          end
    homepage: https://github.com/yasuguin/gmn-cli
    description: "Unofficial fork of google-gemini/gemini-api-cli (Gemini API and Agent Platform). Not affiliated with Google. / google-gemini/gemini-api-cli の非公式の fork（Gemini API と Agent Platform）。Google とは関係ありません。"
    repository:
      owner: yasuguin
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    # ctx.Semver が空なので auto は効かない。版に - があるプレリリースは tap に出さない。
    # タグの接頭辞 gmn-v 自体に - があるので、判定は接頭辞を外した版で行う。
    skip_upload: '{{ if contains (trimprefix .Tag "gmn-v") "-" }}true{{ else }}false{{ end }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

# Release の本文は release-please が書く（PR 単位の変更履歴）。goreleaser は既にある Release に
# asset を足し、本文の後ろに header（免責）を足すだけにする（下の mode: append）。変更履歴は作らない。
changelog:
  disable: true

release:
  github:
    owner: yasuguin
    name: gmn-cli
  # release-please が作った下書きに asset を足し、下書きのまま残す（公開は release workflow の最後のステップ）。
  # use_existing_draft は下書きを名前で探すので、release workflow が下書きの名前をタグに揃えてから動かす。
  draft: true
  use_existing_draft: true
  prerelease: auto
  mode: append
  # GMN_BASE_VERSION は release workflow と scripts/gmn/release-snapshot.sh が internal/cli/version.go から渡す。
  # GitHub Release の tag 名は {{ .Tag }}（gmn-v0.1.0）のまま。本家の v* タグは作らない。
  header: |
    Unofficial fork of google-gemini/gemini-api-cli. Not affiliated with Google.

    Base: google-gemini/gemini-api-cli v{{ .Env.GMN_BASE_VERSION }}

checksum:
  name_template: "checksums.txt"
