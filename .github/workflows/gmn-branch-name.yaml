name: branch-name

# PR のブランチ名が決まりの接頭辞（gmn/・release-please--・upstream-sync/）で始まるかを確かめる（.github/CONTRIBUTING.md）。
# main の ruleset の必須チェック。job 名 branch-name を変えると ruleset の設定も直す必要がある。
# dev-policy: pr-only — PR のブランチ名を見る必須チェックなので、PR で起動しないと意味がない。週 1 回に起動しても検査する対象が無い。
# 中身はブランチ名の case 文だけで、数秒で終わる。
on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

jobs:
    branch-name:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Test the check
              run: bash scripts/gmn/check-branch-name_test.sh

            # noreply と同じく、判定には base 側のスクリプトを使う（PR が自分を判定する検査を書き換えられないように）。
            # base にまだスクリプトが無いとき（スクリプトを入れる PR 自身）だけ、PR 側のものを使う。
            - name: Check branch name
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  checker="$RUNNER_TEMP/check-branch-name.sh"
                  if git cat-file -e "$BASE_SHA:scripts/gmn/check-branch-name.sh" 2>/dev/null; then
                      git show "$BASE_SHA:scripts/gmn/check-branch-name.sh" >"$checker"
                  else
                      echo "::notice::base に検査スクリプトが無いので、PR 側のものを使う"
                      cp scripts/gmn/check-branch-name.sh "$checker"
                  fi
                  bash "$checker" "$HEAD_REF"
