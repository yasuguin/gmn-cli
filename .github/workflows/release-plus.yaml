name: Release plus

# plus-v* のタグだけで動かす。本家の v* タグの release.yaml とは名前空間を分ける。
# GitHub Releases は goreleaser job、PyPI は pypi job、npm は npm job。
on:
  push:
    tags:
      - "plus-v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # release ノートの土台表示に使う本家の版。本家の internal/cli/version.go が正本。
      - name: Read upstream CLI version
        run: |
          cli_version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/version.go)
          if [ -z "$cli_version" ]; then
            printf '::error::Could not read Version from internal/cli/version.go\n'
            exit 1
          fi
          printf 'PLUS_BASE_VERSION=%s\n' "$cli_version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate -f .goreleaser.plus.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-plus-artifacts
          path: |
            dist/
            !dist/*.txt
          retention-days: 30

  pypi:
    needs: goreleaser
    runs-on: ubuntu-latest
    # trusted publishing の対象。environment `pypi` は GitHub の Settings で作る（保守者が手で行う）。
    environment:
      name: pypi
      url: https://pypi.org/project/gemini-headless-cli/
    permissions:
      # PyPI の trusted publishing（OIDC）に必要。API token は使わない。
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download goreleaser artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plus-artifacts
          path: ${{ runner.temp }}/dist

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build wheels
        env:
          PLUS_VERSION: ${{ github.ref_name }}
        run: |
          version="${PLUS_VERSION#plus-v}"
          uv run --no-project packaging/pypi/build_wheels.py \
            --dist "${{ runner.temp }}/dist" \
            --out "${{ runner.temp }}/wheels" \
            --version "$version"

      # 6 種のうち Linux x86_64 を実際に入れて動かし、版が tag と一致することを確かめてから公開する。
      - name: Smoke test wheel
        env:
          PLUS_VERSION: ${{ github.ref_name }}
        run: |
          version="${PLUS_VERSION#plus-v}"
          wheel=$(ls "${{ runner.temp }}"/wheels/*manylinux_2_17_x86_64*.whl)
          out=$(uvx --from "$wheel" gemini-headless-cli --version | head -n 1)
          echo "$out"
          case "$out" in
            "gemini-headless ${version} "*) ;;
            *) printf '::error::--version が tag の版 %s と違う\n' "$version"; exit 1 ;;
          esac

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/wheels/

  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    # trusted publishing の対象。environment `npm` は GitHub の Settings で作る（保守者が手で行う）。
    # npmjs.com 側の trusted publisher の environment 欄は `npm` にそろえる。
    environment:
      name: npm
      url: https://www.npmjs.com/package/gemini-headless-cli
    permissions:
      # npm の trusted publishing（OIDC）に必要。NPM_TOKEN は使わない。--provenance は npm が GitHub Actions で既定で付けるが、明示する。
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download goreleaser artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plus-artifacts
          path: ${{ runner.temp }}/dist

      # npm の trusted publishing は npm CLI 11.5.1 以上が必要（https://docs.npmjs.com/trusted-publishers）。
      # pnpm の publish は trusted publishing に触れていないため、公開は npm CLI で行う。
      # registry-url は付けない（.npmrc に token の行が入り、OIDC の認証と食い違うため）。
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Check npm CLI version
        run: |
          npm_version=$(npm --version)
          printf 'npm %s\n' "$npm_version"
          # 11.5.1 以上であることを確かめる。sort -V -C は並びが昇順のときだけ成功する。
          if ! printf '%s\n%s\n' "11.5.1" "$npm_version" | sort -V -C; then
            printf '::error::npm CLI が 11.5.1 より古い: %s\n' "$npm_version"
            exit 1
          fi

      - name: Build npm packages
        env:
          PLUS_VERSION: ${{ github.ref_name }}
        run: |
          version="${PLUS_VERSION#plus-v}"
          node packaging/npm/build.mjs \
            --dist "${{ runner.temp }}/dist" \
            --out "${{ runner.temp }}/npm" \
            --version "$version"

      # Linux x64 の OS 用バイナリを直接動かし、版が tag と一致することを確かめてから公開する。
      - name: Smoke test native binary
        env:
          PLUS_VERSION: ${{ github.ref_name }}
        run: |
          version="${PLUS_VERSION#plus-v}"
          out=$("${{ runner.temp }}/npm/gemini-headless-cli-linux-x64/gemini-headless" --version | head -n 1)
          echo "$out"
          case "$out" in
            "gemini-headless ${version} "*) ;;
            *) printf '::error::--version が tag の版 %s と違う\n' "$version"; exit 1 ;;
          esac

      # OS 別パッケージを先に出し、本体の optionalDependencies が参照する版を揃えてから本体を出す。
      - name: Publish to npm
        run: |
          set -euo pipefail
          for pkg in gemini-headless-cli-darwin-arm64 gemini-headless-cli-darwin-x64 \
            gemini-headless-cli-linux-arm64 gemini-headless-cli-linux-x64 \
            gemini-headless-cli-win32-arm64 gemini-headless-cli-win32-x64 \
            gemini-headless-cli; do
            npm publish "${{ runner.temp }}/npm/$pkg" --provenance --access public
          done
